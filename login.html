<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Service Request System</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body>
  <div class="auth-card" style="max-width: 400px; margin: 80px auto; padding: 25px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>ICT Service Request System</h2>
    <p style="color: #666; margin-bottom: 20px;">Sign in to access your portal</p>

    <form id="login-form">
      <div style="margin-bottom: 15px;">
        <label for="login-email" style="display:block; margin-bottom: 5px;">Email Address</label>
        <input type="email" id="login-email" style="width: 100%; padding: 8px;" placeholder="user@example.com" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label for="login-password" style="display:block; margin-bottom: 5px;">Password</label>
        <input type="password" id="login-password" style="width: 100%; padding: 8px;" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Sign In</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
